name: Zenodo Deposit

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  deposit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source tree
        run: git archive --format=tar.gz -o sfc_v0.1.0.tar.gz HEAD

      - name: Diagnose token & create deposition
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          echo "=== Step 1: token validity (GET /api/deposit/depositions) ==="
          GET_RESP=$(curl -sS -w "\n__HTTP_%{http_code}__" -H "Authorization: Bearer $ZENODO_TOKEN" "https://zenodo.org/api/deposit/depositions?size=1")
          GET_CODE=$(echo "$GET_RESP" | grep -o '__HTTP_[0-9]*__' | grep -o '[0-9]*')
          echo "GET HTTP status: $GET_CODE"
          echo "GET body (first 400 chars):"
          echo "$GET_RESP" | sed 's/__HTTP_[0-9]*__//' | head -c 400
          echo
          if [ "$GET_CODE" != "200" ]; then
            echo "::error::Token invalid or Zenodo unreachable (HTTP $GET_CODE). Stop."
            exit 1
          fi

          echo "=== Step 2: create deposition (POST) ==="
          cat > meta.json <<'EOF'
          {"metadata":{"title":"Silent Failure Catalog","upload_type":"software","creators":[{"name":"Zhao, Xinghua","orcid":"0009-0001-0512-1237","affiliation":"MedXpert (unregistered name)"}],"description":"A curated catalogue of silent-failure cases and negative controls for AI-agent evaluation. A negative control is a standard experimental-design technique where the right answer is known in advance, so a panel that agrees on a wrong answer is caught rather than scored as consensus. Targets shared systematic error across evaluators. Code under MIT; catalogue content all rights reserved.","access_right":"open","license":"other-open","license_condition":"Code: MIT license. Catalogue content (failure-mode descriptions, taxonomy, index): all rights reserved; reuse requires written permission. See LICENSE and LICENSE-CONTENT in repository.","version":"0.1.0","publication_date":"2026-09-30","keywords":["silent failure","AI evaluation","negative control","agent identity","shared systematic error"],"related_identifiers":[{"identifier":"https://github.com/zhaoxinghua09-cell/silent-failure-catalog","relation":"isSupplementTo","resource_type":"software"}]}}
          EOF
          POST_RESP=$(curl -sS -w "\n__HTTP_%{http_code}__" -H "Authorization: Bearer $ZENODO_TOKEN" -H "Content-Type: application/json" -X POST --data @meta.json "https://zenodo.org/api/deposit/depositions")
          POST_CODE=$(echo "$POST_RESP" | grep -o '__HTTP_[0-9]*__' | grep -o '[0-9]*')
          POST_BODY=$(echo "$POST_RESP" | sed 's/__HTTP_[0-9]*__//')
          echo "POST HTTP status: $POST_CODE"
          echo "POST body:"
          echo "$POST_BODY" | head -c 2000
          echo
          if [ "$POST_CODE" != "201" ]; then
            echo "::error::Deposition creation failed (HTTP $POST_CODE). See body above."
            exit 1
          fi
          DEP_ID=$(echo "$POST_BODY" | jq -r '.id')
          BUCKET=$(echo "$POST_BODY" | jq -r '.links.bucket')
          echo "Deposition id: $DEP_ID  bucket: $BUCKET"

          echo "=== Step 3: upload file ==="
          UP_RESP=$(curl -sS -w "\n__HTTP_%{http_code}__" -H "Authorization: Bearer $ZENODO_TOKEN" -X PUT --data-binary @sfc_v0.1.0.tar.gz "$BUCKET/sfc_v0.1.0.tar.gz")
          echo "UPLOAD HTTP status: $(echo "$UP_RESP" | grep -o '__HTTP_[0-9]*__' | grep -o '[0-9]*')"

          echo "=== Step 4: publish ==="
          PUB_RESP=$(curl -sS -w "\n__HTTP_%{http_code}__" -H "Authorization: Bearer $ZENODO_TOKEN" -X POST "https://zenodo.org/api/deposit/depositions/$DEP_ID/actions/publish")
          PUB_CODE=$(echo "$PUB_RESP" | grep -o '__HTTP_[0-9]*__' | grep -o '[0-9]*')
          PUB_BODY=$(echo "$PUB_RESP" | sed 's/__HTTP_[0-9]*__//')
          echo "PUB HTTP status: $PUB_CODE"
          echo "$PUB_BODY" | head -c 2000
          echo
          if [ "$PUB_CODE" = "202" ]; then
            echo "DOI=$(echo "$PUB_BODY" | jq -r '.doi')"
            echo "CONCEPTDOI=$(echo "$PUB_BODY" | jq -r '.conceptdoi')"
          else
            echo "::error::Publish failed (HTTP $PUB_CODE)"
            exit 1
          fi
