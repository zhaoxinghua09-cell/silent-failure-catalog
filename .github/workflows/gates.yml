name: gates

# `.githooks/pre-commit` is the specification; this file is its echo.
#
# AGENTS.md rule 12 — "a check that cannot run is a check that failed" — is why the
# hook refuses to commit when no interpreter can be found. But that hook protects one
# machine, and only after `git config core.hooksPath .githooks` has been run on it.
# The clone where nobody ran it looks exactly like the clone where everything passed,
# which is the failure shape this catalog is about. This workflow is the copy that
# runs when nobody remembered anything.
#
# The gates below are the same ones, in the same order, with the same meaning, as
# the ones in `.githooks/pre-commit`. If one list changes, the other one is wrong.
# The count is deliberately not written in prose here: AGENTS.md rule 15 keeps it in
# one place, and a hard-coded number in this file would be a second source of truth.
# (The `N/M` step labels are the exception -- they are structural, and they are what
# makes a stale sync between the two lists visible.)
# (As of 2026-10-08 that visibility is enforced rather than hoped for: gates 14 and
# 15 run tools/check-gate-parity.py, which compares this file against the hook and
# fails on any difference -- a missing gate, a changed argument, or a stale `N/M`
# label. The 2026-09-30 drift was found by a human counting; the next one will not
# need one.)
# (Gate 10 runs tools/defect-closure.py, added 2026-10-07: it reads
# docs/defect-ledger.json and fails if any recorded defect is open or missing
# evidence, so a correction cannot be closed by editing only the named site.)
# (Gate 9 runs tools/checker-mutation.py, added 2026-10-07: it mutates the S5
# harness's own checks and requires each mutation to break that selftest, so
# "our checks can fail" is exercised by CI rather than asserted. Review round 3
# had found a gate that had never been shown to be able to fail.)
# (Gate 6 closes the gap where release-consistency ran in CI but not in the hook;
# gate 7 runs the examples/T08-S5Q2 selftest, whose mutation suite is what makes
# "the cases discriminate" a checked property instead of a claim;
# gate 8 runs the examples/S5-Qregister selftest, added 2026-10-06 so that the
# blinded experiment is exercised by CI rather than only by whoever remembered it.)
#
# 2026-10-07 — three defects in this file, each of them the shape this catalog
# documents. They were found by checking the released artifact instead of the
# intent: the canonical tag `v0.1.0` did not pass the command the README invites
# readers to run, and nothing in this workflow could have noticed.
#   1. `on.push` listed `branches: [main]` only, so a version tag triggered no run.
#      The release the README tells readers to cite was the one commit no gate was
#      ever executed on. Tags matching `v*` now trigger this workflow.
#   2. The release-consistency step passed `--ref v0.1.0` explicitly. A hard-coded
#      version inside the release check is a second source of truth, and it goes
#      stale the moment the anchor moves — which is the defect class the gate exists
#      to catch. The gate now reads the ref out of `README.md`.
#   3. Gate 6 shells out to `gh api` to resolve the tag object, and no `GH_TOKEN`
#      was set. On the runner it therefore failed to authenticate, printed
#      "⚠ 远程 tag 校验跳过", and still exited 0 with "✅ 一致". The one check that
#      could have seen a stale anchor never ran, inside the gate written to catch
#      exactly that. `GH_TOKEN` is now provided, and a canonical ref that cannot be
#      resolved is a failure rather than a skip.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: gates · python ${{ matrix.python }}
    runs-on: ubuntu-22.04  # pinned: Python 3.9 has no ubuntu-24.04 build (host image migrated); see PR #25
    # `gh` is preinstalled on the runner but unauthenticated unless a token is handed
    # to it. Gate 6 resolves the tag object through the API, so this token is part of
    # whether the gate can run at all (defect 3 above).
    env:
      GH_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor this repository claims ("stdlib-only, no network, Python
        # 3.9+"). 3.12 is a contemporary interpreter. If the claim has drifted, this
        # job is where the drift becomes visible rather than a sentence in a table.
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - name: Interpreter under test
        run: python -VV

      # The gate steps below are GENERATED from `.githooks/pre-commit`, which is the
      # specification; this file is its echo. Do not hand-edit the block -- gate 15
      # fails if it and the hook disagree. To regenerate:
      #   python tools/check-gate-parity.py --emit-ci
      # BEGIN GENERATED GATE STEPS -- edit .githooks/pre-commit, then
      # Every gate carries `if: always()` so that a failure in one does not hide
      # the state of the others: the job is red if any gate failed, and the report
      # is the complete list rather than the first casualty.
      - name: "1/20 gate-lint selftest"
        if: always()
        run: python tools/gate-lint.py --selftest
      - name: "2/20 catalog selftest"
        if: always()
        run: python tools/check-catalog.py --selftest
      - name: "3/20 catalog consistency (indexes, the six targets, link discipline)"
        if: always()
        run: python tools/check-catalog.py
      - name: "4/20 de-identification scan"
        if: always()
        run: python tools/check-catalog.py --scan-leaks
      - name: "5/20 content manifest"
        if: always()
        run: python tools/make-manifest.py --check
      - name: "6/20 release consistency (canonical anchor resolves · manifest matches)"
        if: always()
        run: python tools/verify_release_consistency.py --repo-path . --repo "${{ github.repository }}" --allow-absent-canonical-tag
      - name: "7/20 release face (one version, told the same way on every face)"
        if: always()
        run: python tools/verify_release_face.py --repo-path . --no-remote
      - name: "8/20 examples selftest (T08-S5Q2 cases + mutation suite)"
        if: always()
        run: python examples/T08-S5Q2/simulation.py --selftest
      - name: "9/20 blinded example selftest (S5-Qregister blinded run + mutation suite)"
        if: always()
        run: python examples/S5-Qregister/simulation.py --selftest
      - name: "10/20 checker mutation (the checks themselves must be able to fail)"
        if: always()
        run: python tools/checker-mutation.py
      - name: "11/20 defect closure (every recorded correction is closed with evidence)"
        if: always()
        run: python tools/defect-closure.py
      - name: "12/20 defect closure selftest (that gate must be able to fail too)"
        if: always()
        run: python tools/defect-closure.py --selftest
      - name: "13/20 implementation mutation (source-level watch on the artifact under test)"
        if: always()
        run: python tools/impl-mutation.py
      - name: "14/20 line endings (the index carries no CRLF)"
        if: always()
        run: python tools/check-line-endings.py
      - name: "15/20 gate parity selftest (that gate must be able to fail too)"
        if: always()
        run: python tools/check-gate-parity.py --selftest
      - name: "16/20 gate parity hook-vs-ci (the hook and this file run the same gates)"
        if: always()
        run: python tools/check-gate-parity.py
      - name: "17/20 prepare selftest (the ordering and its limits must be able to fail)"
        if: always()
        run: python tools/prepare.py --selftest
      - name: "18/20 quoted output (verbatim blocks equal the command that produced them)"
        if: always()
        run: python tools/check-quoted-output.py
      - name: "19/20 hook dependencies (the hook starts and reports on shell builtins alone)"
        if: always()
        run: python tools/check-hook-deps.py
      - name: "20/20 hook dependencies selftest (that gate must be able to fail too)"
        if: always()
        run: python tools/check-hook-deps.py --selftest

      # END GENERATED GATE STEPS

  negative-control:
    # The job *name* is load-bearing and must not be edited on its own. Branch protection
    # on `main` lists `negative control · the manifest gate must be able to fail` as a
    # required status check, and a required check is matched by name. Renaming the job
    # here silently un-requires it: the rule then waits for a context no run will ever
    # report. That is this catalogue's own subject, so it is written down — if this name
    # ever has to change, the branch-protection rule changes in the same move.
    name: negative control · the manifest gate must be able to fail
    runs-on: ubuntu-22.04  # pinned: Python 3.9 has no ubuntu-24.04 build (host image migrated); see PR #25
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      # README.md — "one byte is corrupted on purpose in CI and the verification is
      # *required* to fail" — and CONTRIBUTING.md both promise this. It is what makes
      # the job above mean anything: a `--check` that cannot fail would pass all
      # gates, and the badge would be a claim about a run that proves nothing.
      #
      # Three assertions. The third is the one usually left out, and it is the one
      # that separates "this gate works" from "this gate is stuck red": a check that
      # rejects everything is as useless as a check that rejects nothing, and only
      # re-running it on the restored tree tells the two apart.
      - name: A — the committed tree passes
        run: python tools/make-manifest.py --check

      - name: B — one byte appended is rejected
        run: |
          set -u
          target="$(ls failures/SF-*.md | head -1)"
          cp "$target" "${RUNNER_TEMP}/pristine.md"
          printf 'X' >> "$target"
          echo "appended one byte to ${target}"
          if python tools/make-manifest.py --check; then
            echo "::error::--check exited 0 after ${target} was altered by one byte; the manifest gate cannot see drift"
            exit 1
          fi
          echo "rejected, as required"

      - name: C — the restored tree passes again
        run: |
          set -u
          target="$(ls failures/SF-*.md | head -1)"
          cp "${RUNNER_TEMP}/pristine.md" "$target"
          python tools/make-manifest.py --check
          echo "accepted again — the gate is not simply always red"

      # Gate 6 gained manifest coverage on 2026-10-07; before that it did not look at
      # the manifest at all, which is how a release tag shipped carrying a stale one.
      # Coverage that is never shown to be able to fail is coverage by assertion, so
      # the same one-byte drift is put through gate 6 as well, and the tree is then
      # restored and re-checked — the "stuck red" discriminator again, on the new path.
      - name: D — gate 6 fails on the same drift, and passes again once it is restored
        run: |
          set -u
          target="$(ls failures/SF-*.md | head -1)"
          cp "$target" "${RUNNER_TEMP}/pristine.md"
          printf 'X' >> "$target"
          if python tools/verify_release_consistency.py --repo-path . --no-remote; then
            echo "::error::gate 6 exited 0 while the tree had drifted from the manifest"
            exit 1
          fi
          echo "rejected, as required"
          cp "${RUNNER_TEMP}/pristine.md" "$target"
          python tools/verify_release_consistency.py --repo-path . --no-remote
          echo "accepted again"

  no-coreutils:
    # The reason this job exists is a defect, not a preference (docs/building-this-catalog.md
    # item 12, docs/defect-ledger.json D-036). On 2026-11-12 the hook ran on a machine with
    # Git installed and working, needed `dirname` to find its own directory, did not find it,
    # and reported every gate as "missing" -- the one sentence that cannot be told apart from
    # a real deletion. Gate 19 asserts the property, but every runner here has coreutils, so
    # gate 19 could never go red in CI *for the reason it exists*. This job takes coreutils
    # away and checks both directions: the hook must still start, and the gate must still
    # reject the line that caused the defect.
    #
    # Nothing here changes the gate list, so gate parity is not affected: this job runs the
    # hook and gate 19 against fixtures, it does not add a gate to the hook.
    name: no coreutils · the hook must start, and gate 19 must still be able to say no
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Build a PATH that holds an interpreter and nothing else
        run: |
          set -eu
          bare="${RUNNER_TEMP}/bare"
          rm -rf "$bare"
          mkdir -p "$bare"
          python_bin="$(command -v python3)"
          ln -s "$python_bin" "$bare/python3"
          ln -s "$python_bin" "$bare/python"
          echo "BARE=$bare" >> "$GITHUB_ENV"
          echo "bare PATH: $bare (holds python3 and python only)"

      # The judge must be able to say no before its yes means anything. Six controls,
      # including one that fixes its own blind spot as accepted rather than pretending.
      - name: The judge itself must be able to fail
        run: python tools/no_coreutils_assert.py --selftest

      # The control on the control. A job that says "no coreutils" while /usr/bin is still
      # on PATH proves nothing, and would be the assertive-but-vacuous shape this catalog
      # is about. So the absence is measured before it is relied on.
      #
      # `/bin/sh`, not `sh`: the first run of this job found `sh: command not found` inside
      # its own step, because `sh` is resolved through the very PATH we had just emptied.
      # Worse, that made the measurement below pass vacuously -- every probe returned 127
      # and "absence" was confirmed for all twenty-seven binaries without one of them being
      # looked for. The harness reproduced the defect it exists to demonstrate.
      - name: The environment really does lack the binaries this defect used
        run: |
          set -u
          still=0
          for c in dirname basename sed awk grep cut tr head tail wc sort uniq xargs \
                   find mktemp date cat ln mkdir rm cp mv chmod stat realpath which; do
            if PATH="$BARE" /bin/sh -c "command -v $c" >/dev/null 2>&1; then
              echo "::error::$c is still reachable with PATH=$BARE — this job would be a claim, not a test"
              still=1
            fi
          done
          if [ "$still" -ne 0 ]; then exit 1; fi
          echo "confirmed: none of those binaries is reachable"

      # Direction 1 — the hook gets to its gates. It may well fail some of them on a PATH
      # this thin (gate 6 resolves the canonical tag through git), and that is not the
      # question here; the question is whether it fails *for the reason in the catalog*.
      # The three sentences below are the defect, verbatim.
      - name: The hook starts and reports, without the sentences that made it lie
        run: |
          set +eu
          PYTHON= PATH="$BARE" /bin/sh .githooks/pre-commit > "${RUNNER_TEMP}/hook.out" 2>&1
          rc=$?
          set -eu
          python tools/no_coreutils_assert.py hook "${RUNNER_TEMP}/hook.out" "$rc"

      # Direction 2 — gate 19 goes red, in CI, on the exact line that caused the defect.
      # Without this the gate would be "always green here", which is the family this
      # catalog calls a decorative gate.
      - name: Gate 19 rejects the line that caused the defect
        run: |
          set -eu
          hook="${RUNNER_TEMP}/hook_with_dirname"
          cp .githooks/pre-commit "$hook"
          printf '\ncd "$(dirname "$0")/.." || exit 1\n' >> "$hook"
          if python tools/check-hook-deps.py --file "$hook"; then
            echo "::error::gate 19 accepted a hook that needs dirname to find itself"
            exit 1
          fi
          echo "rejected, as required"

      # Direction 3 — the gate's own scanner must not need the binaries it forbids.
      - name: Gate 19 itself runs with no coreutils on PATH
        run: PATH="$BARE" python3 tools/check-hook-deps.py

      # Direction 4 — the second half of the defect: an interpreter that is *found* is not
      # an interpreter that *works*. The Windows Store alias exits 49 and prints nothing,
      # and the hook ran eighteen gates through it, reporting eighteen failures with empty
      # bodies. A stub reproduces that exactly, and the hook must refuse before running
      # anything rather than report the gates as failed.
      - name: A stub interpreter is refused, not used
        run: |
          set +eu
          stub="${RUNNER_TEMP}/stub49"
          printf '#!/bin/sh\nexit 49\n' > "$stub"
          chmod +x "$stub"
          ln -sf "$stub" "$BARE/python3"
          ln -sf "$stub" "$BARE/python"
          PYTHON= PATH="$BARE" /bin/sh .githooks/pre-commit > "${RUNNER_TEMP}/stub.out" 2>&1
          rc=$?
          set -eu
          python tools/no_coreutils_assert.py stub "${RUNNER_TEMP}/stub.out" "$rc"
