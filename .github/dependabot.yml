# 由 SECBASE-01 D-2 批量铺设（2026-10-12）——Dependency-Update-Tool 基线
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # 仅接受小版本/补丁更新：checkout 与 setup-python 的 major 跳变不可用（无对应 tag）
    ignore:
      - dependency-name: "actions/checkout"
        update-types: ["version-update:semver-major"]
      - dependency-name: "actions/setup-python"
        update-types: ["version-update:semver-major"]